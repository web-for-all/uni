<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sites</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><path d='M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z'/></svg>">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PapaParse for CSV Parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header Section -->
    <header class="bg-gradient-to-r from-indigo-600 to-blue-600 text-white py-8 px-4 shadow-md">
        <div class="max-w-3xl mx-auto text-center">
            <h1 class="text-2xl sm:text-3xl font-extrabold mb-2 flex items-center justify-center gap-2">
                <i class="fa-solid fa-bookmark"></i> My sites
            </h1>
            <p class="text-indigo-100 text-sm">بسم الله الرحمن الرحيم</p>
            
            <!-- Real-time Search Input -->
            <div class="mt-6 relative max-w-md mx-auto">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="searchInput" placeholder="Search by name or notes..." 
                       class="w-full pl-11 pr-4 py-3 rounded-xl text-slate-800 bg-white/95 backdrop-blur focus:outline-none focus:ring-2 focus:ring-white shadow-sm text-sm placeholder-slate-400 transition-all">
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-3xl w-full mx-auto p-4 sm:p-6">
        <!-- Loading Spinner -->
        <div id="loading" class="text-center py-20">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-600 border-t-transparent"></div>
            <p class="mt-3 text-slate-500 font-medium text-sm">Fetching sites data...</p>
        </div>

        <!-- Error State Message -->
        <div id="error" class="hidden bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-xl text-center my-6 shadow-sm text-sm">
            <i class="fa-solid fa-triangle-exclamation mr-2"></i> Failed to load data. Please ensure the Google Sheet is published as CSV.
        </div>

        <!-- Cards Container -->
        <div id="cardsContainer" class="space-y-4 hidden">
            <!-- Dynamic cards will be populated here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400 shadow-inner">
        <p>Copy rights</p>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // Google Sheet CSV URL
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRWefZtDRzEamNRs255rGDR-eR5Sw_V1zrxXPRW5EJ-RxaBUF2Qtlz9HOeeoCKAw7tlTw5TVUscFi-g/pub?output=csv';
        
        let allSites = [];

        async function fetchSites() {
            Papa.parse(csvUrl, {
                download: true,
                header: false,
                skipEmptyLines: true,
                complete: function(results) {
                    document.getElementById('loading').classList.add('hidden');
                    
                    if (results.data && results.data.length > 1) {
                        // Skip the first row (header) unconditionally
                        let rows = results.data.slice(1);
                        
                        // Mapping: Col A (0) = ID, Col B (1) = Name, Col C (2) = URL, Col D (3) = Notes
                        allSites = rows.map((row, index) => ({
                            id: row[0] || (index + 1),
                            name: row[1] || 'Unnamed Site',
                            url: row[2] ? row[2].trim() : '#',
                            notes: row[3] || ''
                        })).filter(site => site.url !== '#' && site.url !== '');

                        renderSites(allSites);
                        document.getElementById('cardsContainer').classList.remove('hidden');
                    } else {
                        showError();
                    }
                },
                error: function(err) {
                    console.error(err);
                    showError();
                }
            });
        }

        function renderSites(sites) {
            const container = document.getElementById('cardsContainer');
            
            if (sites.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500 bg-white rounded-xl shadow-sm border border-slate-100 text-sm">No matching sites found.</div>`;
                return;
            }

            container.innerHTML = sites.map(site => `
                <div class="bg-white rounded-2xl shadow-sm hover:shadow-md transition-all duration-300 border border-slate-100 p-4 sm:p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 group">
                    <div class="flex items-start gap-3.5 flex-grow">
                        <div class="bg-indigo-50 text-indigo-600 font-bold text-sm w-9 h-9 rounded-xl flex items-center justify-center shrink-0 border border-indigo-100 group-hover:bg-indigo-600 group-hover:text-white transition-colors">
                            ${escapeHtml(String(site.id))}
                        </div>
                        <div class="overflow-hidden">
                            <h3 class="font-bold text-base text-slate-800 group-hover:text-indigo-600 transition-colors">${escapeHtml(site.name)}</h3>
                            ${site.notes ? `<p class="text-slate-500 text-xs sm:text-sm mt-1 flex items-center gap-1.5"><i class="fa-solid fa-circle-info text-xs text-indigo-500"></i> ${escapeHtml(site.notes)}</p>` : ''}
                            <span class="text-[11px] text-slate-400 mt-1 block truncate max-w-[250px] sm:max-w-md"><i class="fa-solid fa-link text-[9px] mr-1"></i>${escapeHtml(site.url)}</span>
                        </div>
                    </div>
                    <a href="${ensureHttp(site.url)}" target="_blank" rel="noopener noreferrer" 
                       class="w-full sm:w-auto bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white px-4 py-2.5 rounded-xl font-semibold text-xs sm:text-sm transition-all flex items-center justify-center gap-2 shadow-sm shrink-0">
                        <span>Visit Site</span>
                        <i class="fa-solid fa-arrow-right-long text-xs"></i>
                    </a>
                </div>
            `).join('');
        }

        function ensureHttp(url) {
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                return 'https://' + url;
            }
            return url;
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function showError() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
        }

        // Live Filter Event
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allSites.filter(site => 
                site.name.toLowerCase().includes(term) || 
                site.notes.toLowerCase().includes(term) ||
                String(site.id).includes(term)
            );
            renderSites(filtered);
        });

        // Initialize App
        fetchSites();
    </script>
</body>
</html>
