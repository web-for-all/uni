<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معي</title>
    
    <!-- Favicon تواصل معي (SVG مضمن - أيقونة محادثة/تواصل) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%2338bdf8' d='M64 0C28.7 0 0 28.7 0 64L0 352c0 35.3 28.7 64 64 64l96 0 0 80c0 6.1 3.4 11.6 8.8 14.3s11.9 2.1 16.8-1.5L293.3 416L448 416c35.3 0 64-28.7 64-64l0-288c0-35.3-28.7-64-64-64L64 0zM224 224a32 32 0 1 1 64 0 32 32 0 1 1 -64 0zm-96 0a32 32 0 1 1 64 0 32 32 0 1 1 -64 0zm192 0a32 32 0 1 1 64 0 32 32 0 1 1 -64 0z'/></svg>">
    
    <!-- خط Tajawal وتنسيقات FontAwesome للأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #030712;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.8) 0px, transparent 100%);
            background-attachment: fixed;
            padding: 20px;
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* دوائر الخلفية المضاءة بأسلوب النيون */
        .glow-sphere-1 {
            position: absolute;
            width: 250px;
            height: 250px;
            background: rgba(56, 189, 248, 0.2);
            filter: blur(90px);
            border-radius: 50%;
            top: 15%;
            left: 10%;
            z-index: 0;
        }

        .glow-sphere-2 {
            position: absolute;
            width: 220px;
            height: 220px;
            background: rgba(139, 92, 246, 0.18);
            filter: blur(90px);
            border-radius: 50%;
            bottom: 15%;
            right: 10%;
            z-index: 0;
        }

        /* البطاقة الزجاجية المظلمة */
        .glass-card {
            position: relative;
            z-index: 1;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 28px;
            padding: 32px 24px;
            width: 100%;
            max-width: 410px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        /* شعار/أيقونة التواصل */
        .avatar-wrapper {
            position: relative;
            width: 86px;
            height: 86px;
            margin: 0 auto 18px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(37, 99, 235, 0.3));
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            color: #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
        }

        .avatar-ring {
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border: 2px stroke transparent;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, transparent, #818cf8) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            animation: rotateRing 8s linear infinite;
        }

        @keyframes rotateRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .greeting-title {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }

        /* الشارات التفاعلية */
        .badges-wrapper {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .badge-live {
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .badge-info {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.25);
            color: #38bdf8;
        }

        /* صندوق الرسائل */
        .message-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 24px;
            text-align: right;
            backdrop-filter: blur(10px);
        }

        .msg-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .msg-row:last-child {
            margin-bottom: 0;
        }

        .msg-icon {
            color: #38bdf8;
            font-size: 15px;
            margin-top: 3px;
            background: rgba(56, 189, 248, 0.1);
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* أزرار الاتصال والواتساب */
        .actions-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 15px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            border: 1px solid transparent;
        }

        .btn-call {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #ffffff;
            box-shadow: 0 10px 20px -5px rgba(2, 132, 199, 0.4);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-call:active {
            transform: scale(0.98);
            box-shadow: 0 5px 10px -3px rgba(2, 132, 199, 0.4);
        }

        .btn-whatsapp {
            background: linear-gradient(135deg, #15803d, #16a34a);
            color: #ffffff;
            box-shadow: 0 10px 20px -5px rgba(22, 163, 74, 0.4);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-whatsapp:active {
            transform: scale(0.98);
            box-shadow: 0 5px 10px -3px rgba(22, 163, 74, 0.4);
        }

        .action-btn i {
            font-size: 20px;
        }

        /* مؤشر التحميل */
        .loader-container {
            padding: 30px 0;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(56, 189, 248, 0.2);
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 14px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer-tag {
            margin-top: 22px;
            font-size: 12px;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="glow-sphere-1"></div>
    <div class="glow-sphere-2"></div>

    <div class="glass-card">
        <!-- شعار/أيقونة التواصل -->
        <div class="avatar-wrapper">
            <div class="avatar-ring"></div>
            <div class="avatar">
                <i class="fa-solid fa-comments"></i>
            </div>
        </div>

        <!-- أداة التحميل -->
        <div id="loader" class="loader-container">
            <div class="spinner"></div>
            <p style="font-size: 13px; color: #94a3b8;">فضلا الإنتظار...</p>
        </div>

        <!-- المحتوى الرئيسي -->
        <div id="main-content" style="display: none;">
            <!-- الخلية 1: الترحيب -->
            <h1 class="greeting-title" id="cell1">السلام عليكم</h1>

            <!-- الشارات التفاعلية -->
            <div class="badges-wrapper">
                <div class="badge badge-live">
                    <span class="pulse-dot"></span>
                    <span>متصل</span>
                </div>
                <div class="badge badge-info">
                    <i class="fa-solid fa-address-card"></i>
                    <span>تواصل معي</span>
                </div>
            </div>

            <!-- صندوق الرسائل النصية -->
            <div class="message-card">
                <!-- الخلية 2 -->
                <div class="msg-row">
                    <div class="msg-icon"><i class="fa-solid fa-bell"></i></div>
                    <span id="cell2">...</span>
                </div>
                <!-- الخلية 3 -->
                <div class="msg-row" id="cell3-container">
                    <div class="msg-icon"><i class="fa-solid fa-comment-dots"></i></div>
                    <span id="cell3">...</span>
                </div>
            </div>

            <!-- الأزرار للتواصل -->
            <div class="actions-group">
                <a id="callBtn" href="#" class="action-btn btn-call">
                    <i class="fa-solid fa-phone-flip"></i>
                    <span>اتصال هاتفي مباشر</span>
                </a>
                <a id="waBtn" href="#" target="_blank" class="action-btn btn-whatsapp">
                    <i class="fa-brands fa-whatsapp"></i>
                    <span>مراسلة عبر الواتساب</span>
                </a>
            </div>

            <div class="footer-tag">
                <i class="fa-solid fa-heart" style="color: #ef4444;"></i>
                <span>شكراً لتعاونك ولطفك</span>
            </div>
        </div>
    </div>

    <script>
        const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRKLa36_tthabd1sTg54xaU9GVmpN_jKtB14gmthuGNfnR3yNFcKLBW-pRxFZYJuUfM5B6noyIHMZKV/pub?output=csv';

        // دالة قراءة وقسمة CSV بدقة مع معالجة الفواصل والأسطر
        function parseCSVLine(text) {
            let results = [];
            let entry = [];
            let inQuotes = false;
            let current = '';

            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    if (current || entry.length > 0) {
                        entry.push(current.trim().replace(/^"|"$/g, ''));
                        results.push(entry);
                        entry = [];
                        current = '';
                    }
                } else if (char === ',' && !inQuotes) {
                    entry.push(current.trim().replace(/^"|"$/g, ''));
                    current = '';
                } else {
                    current += char;
                }
            }
            if (current || entry.length > 0) {
                entry.push(current.trim().replace(/^"|"$/g, ''));
                results.push(entry);
            }
            
            // استخراج عمود A فقط من كل صف
            return results.map(row => row[0]).filter(val => val !== undefined);
        }

        async function loadSheetData() {
            try {
                // منع الكاش بإضافة وقت التحديث
                const response = await fetch(sheetCsvUrl + '&cacheBuster=' + Date.now());
                const csvData = await response.text();
                
                const colA = parseCSVLine(csvData);

                // تعيين البيانات من العمود A
                const val1 = colA[0] || 'السلام عليكم';
                const val2 = colA[1] || 'يرجى الاتصال بي في حال وجود أي استفسار.';
                const val3 = colA[2] || '';
                let rawPhone = colA[3] || '';

                // تحديث العناصر في الواجهة
                document.getElementById('cell1').innerText = val1;
                document.getElementById('cell2').innerText = val2;

                if (val3 && val3.trim() !== '') {
                    document.getElementById('cell3').innerText = val3;
                    document.getElementById('cell3-container').style.display = 'flex';
                } else {
                    document.getElementById('cell3-container').style.display = 'none';
                }

                // معالجة رقم الهاتف وإعداد الأزرار
                const cleanPhone = rawPhone.replace(/[^0-9+]/g, '');

                if (cleanPhone) {
                    document.getElementById('callBtn').href = `tel:+${cleanPhone}`;
                    
                    const waMessage = encodeURIComponent('السلام عليكم، أود التواصل معك.');
                    const formattedWaPhone = cleanPhone.replace('+', '');
                    document.getElementById('waBtn').href = `https://wa.me/${formattedWaPhone}?text=${waMessage}`;
                } else {
                    document.getElementById('callBtn').style.display = 'none';
                    document.getElementById('waBtn').style.display = 'none';
                }

                // عرض المحتوى وإخفاء التحميل
                document.getElementById('loader').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';

            } catch (err) {
                console.error('خطأ في جلب البيانات:', err);
                document.getElementById('loader').innerHTML = '<p style="color: #f87171; font-size: 13px;">تعذر جلب البيانات، يرجى المحاولة لاحقاً.</p>';
            }
        }

        loadSheetData();
    </script>
</body>
</html>
