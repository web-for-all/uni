<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>متجر النخبة | كتالوج المنتجات</title>
    
    <!-- خطوط جوجل العربية العصرية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- مكتبة PapaParse لتحليل ملفات CSV بدقة وتحويلها إلى JSON -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        /* ==========================================================================
           1. متغيرات الهوية البصرية والألوان (يمكنك تعديل الألوان بسهولة من هنا)
           ========================================================================== */
        :root {
            --primary: #0f172a;          /* كحلي داكن فخم */
            --primary-hover: #1e293b;
            --accent: #059669;           /* أخضر زمردي أنيق يناسب الهوية السعودية */
            --accent-hover: #047857;
            --accent-light: #ecfdf5;
            --discount-bg: #dc2626;      /* أحمر للخصومات */
            --whatsapp: #25D366;
            --whatsapp-hover: #1ebe5d;
            --bg-body: #f8fafc;          /* خلفية هادئة تبرز صور المنتجات */
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 20px 35px -10px rgba(15, 23, 42, 0.15);
            --radius-md: 12px;
            --radius-lg: 18px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ==========================================================================
           2. التأسيس العام
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        button, input, select {
            font-family: inherit;
        }

        /* ==========================================================================
           3. الشريط الإعلاني العلوي والهيدر
           ========================================================================== */
        .announcement-bar {
            background: linear-gradient(90deg, var(--primary), #1e293b);
            color: #fff;
            text-align: center;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        header {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: var(--transition);
        }

        .header-container {
            max-width: 1320px;
            margin: 0 auto;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--primary);
        }

        .brand-logo-icon {
            width: 42px;
            height: 42px;
            background: var(--primary);
            color: #fff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.3rem;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
        }

        .brand-info h1 {
            font-size: 1.25rem;
            font-weight: 800;
            line-height: 1.2;
        }

        .sync-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(5, 150, 105, 0.6); }
            70% { box-shadow: 0 0 0 6px rgba(5, 150, 105, 0); }
            100% { box-shadow: 0 0 0 0 rgba(5, 150, 105, 0); }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-icon {
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            height: 42px;
            padding: 0 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
            position: relative;
        }

        .btn-icon:hover {
            background: #e2e8f0;
        }

        .btn-icon.spinning svg {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(-360deg); }
        }

        .cart-badge {
            background: var(--discount-bg);
            color: #fff;
            font-size: 0.72rem;
            font-weight: 800;
            min-width: 20px;
            height: 20px;
            border-radius: 99px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
        }

        /* ==========================================================================
           4. شريط البحث والفلاتر الذكية
           ========================================================================== */
        .controls-section {
            max-width: 1320px;
            margin: 20px auto 10px;
            padding: 0 20px;
        }

        .search-sort-bar {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 12px;
            margin-bottom: 16px;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box svg {
            position: absolute;
            right: 14px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .search-box input {
            width: 100%;
            height: 46px;
            padding: 0 42px 0 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-card);
            font-size: 0.95rem;
            color: var(--text-main);
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08);
        }

        .sort-select {
            height: 46px;
            padding: 0 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-card);
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }

        .stock-toggle {
            height: 46px;
            padding: 0 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-card);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            user-select: none;
            box-shadow: var(--shadow-sm);
        }

        .stock-toggle input {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* شريط الفئات */
        .categories-wrapper {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 2px 12px;
            scrollbar-width: none;
        }

        .categories-wrapper::-webkit-scrollbar {
            display: none;
        }

        .category-pill {
            white-space: nowrap;
            padding: 8px 18px;
            border-radius: 99px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .category-pill:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .category-pill.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.18);
        }

        .results-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* ==========================================================================
           5. شبكة المنتجات والبطاقات
           ========================================================================== */
        .products-grid {
            max-width: 1320px;
            margin: 14px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
            gap: 22px;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
            border-color: #cbd5e1;
        }

        .product-card.out-of-stock {
            opacity: 0.78;
        }

        /* معرض الصور المصغر داخل البطاقة */
        .card-media {
            position: relative;
            aspect-ratio: 1 / 1;
            background: #f1f5f9;
            overflow: hidden;
            cursor: pointer;
        }

        .card-slider-track {
            display: flex;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            scroll-behavior: smooth;
        }

        .card-slider-track::-webkit-scrollbar {
            display: none;
        }

        .card-slide {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .product-card:hover .card-slide img {
            transform: scale(1.04);
        }

        .out-of-stock .card-slide img {
            filter: grayscale(65%);
        }

        .img-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            color: var(--text-muted);
            padding: 20px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 700;
        }

        /* أسهم ونقاط السلايدر المصغر */
        .slider-dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(4px);
            padding: 4px 8px;
            border-radius: 99px;
            z-index: 3;
        }

        .slider-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transition: var(--transition);
        }

        .slider-dot.active {
            background: #fff;
            width: 14px;
            border-radius: 99px;
        }

        .card-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: var(--transition);
            z-index: 3;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .card-media:hover .card-nav-btn {
            opacity: 1;
        }

        .card-nav-btn.prev { right: 8px; }
        .card-nav-btn.next { left: 8px; }

        /* الشارات (الخصم ونفاذ الكمية) */
        .badges-container {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 4;
            pointer-events: none;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 800;
            color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .badge-discount {
            background: var(--discount-bg);
        }

        .badge-out {
            background: #334155;
        }

        .photo-count-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(15, 23, 42, 0.65);
            color: #fff;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            z-index: 4;
            pointer-events: none;
        }

        /* محتوى البطاقة */
        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-category {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 6px;
            cursor: pointer;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-title:hover {
            color: var(--accent);
        }

        .card-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 14px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }

        .card-price-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .current-price {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary);
        }

        .currency {
            font-size: 0.82rem;
            font-weight: 700;
        }

        .old-price {
            font-size: 0.88rem;
            color: #94a3b8;
            text-decoration: line-through;
            font-weight: 600;
        }

        .card-actions {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
        }

        .btn-details {
            background: var(--primary);
            color: #fff;
            border: none;
            height: 40px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-details:hover {
            background: var(--primary-hover);
        }

        .btn-add-cart {
            background: var(--accent-light);
            color: var(--accent);
            border: 1px solid rgba(5, 150, 105, 0.25);
            height: 40px;
            padding: 0 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: var(--transition);
        }

        .btn-add-cart:hover {
            background: var(--accent);
            color: #fff;
        }

        .btn-disabled {
            background: #e2e8f0 !important;
            color: #94a3b8 !important;
            border-color: transparent !important;
            cursor: not-allowed !important;
        }

        /* ==========================================================================
           6. شاشات التحميل الهيكلية (Skeleton)
           ========================================================================== */
        .skeleton {
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ==========================================================================
           7. نافذة تفاصيل المنتج (Quick View Modal)
           ========================================================================== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.open {
            display: flex;
            opacity: 1;
        }

        .modal-box {
            background: var(--bg-card);
            width: 100%;
            max-width: 920px;
            max-height: 92vh;
            border-radius: 22px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            box-shadow: var(--shadow-lg);
            position: relative;
            animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalPop {
            from { transform: scale(0.94) translateY(10px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-close {
            position: absolute;
            top: 14px;
            left: 14px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }

        .modal-gallery {
            background: #f8fafc;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            justify-content: center;
            border-left: 1px solid var(--border-color);
        }

        .modal-main-img-wrap {
            position: relative;
            aspect-ratio: 1 / 1;
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            background: #fff;
            border: 1px solid var(--border-color);
            cursor: zoom-in;
        }

        .modal-main-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .zoom-hint {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(15, 23, 42, 0.65);
            color: #fff;
            font-size: 0.72rem;
            padding: 4px 10px;
            border-radius: 99px;
            pointer-events: none;
        }

        .modal-thumbs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .modal-thumb {
            width: 60px;
            height: 60px;
            flex-shrink: 0;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid transparent;
            cursor: pointer;
            opacity: 0.65;
            transition: var(--transition);
            background: #fff;
        }

        .modal-thumb.active {
            border-color: var(--primary);
            opacity: 1;
        }

        .modal-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-info {
            padding: 28px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .modal-meta-top {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .modal-sku {
            font-size: 0.75rem;
            background: #f1f5f9;
            color: var(--text-muted);
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        .modal-title {
            font-size: 1.45rem;
            font-weight: 800;
            line-height: 1.35;
            margin-bottom: 12px;
        }

        .modal-price-box {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 14px 16px;
            border-radius: 14px;
            margin-bottom: 16px;
        }

        .modal-prices {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
        }

        .modal-current-price {
            font-size: 1.65rem;
            font-weight: 800;
            color: var(--primary);
        }

        .savings-pill {
            display: inline-block;
            margin-top: 6px;
            background: var(--accent-light);
            color: var(--accent);
            font-size: 0.82rem;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 6px;
        }

        .modal-desc {
            font-size: 0.95rem;
            color: #334155;
            white-space: pre-line;
            margin-bottom: 24px;
            flex: 1;
        }

        .modal-cta-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
        }

        .btn-whatsapp-direct {
            background: var(--whatsapp);
            color: #fff;
            border: none;
            height: 48px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: var(--transition);
            box-shadow: 0 6px 16px rgba(37, 211, 102, 0.25);
        }

        .btn-whatsapp-direct:hover {
            background: var(--whatsapp-hover);
            transform: translateY(-2px);
        }

        .modal-secondary-actions {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
        }

        .btn-share {
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            height: 44px;
            padding: 0 16px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* ==========================================================================
           8. سلة المشتريات الجانبية (Cart Drawer) + الزر العائم
           ========================================================================== */
        .floating-cart-btn {
            position: fixed;
            bottom: 22px;
            left: 22px;
            background: var(--primary);
            color: #fff;
            border: none;
            height: 56px;
            padding: 0 22px;
            border-radius: 99px;
            display: none;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.3);
            z-index: 900;
            transition: var(--transition);
        }

        .floating-cart-btn.visible {
            display: flex;
        }

        .floating-cart-btn:hover {
            transform: scale(1.04);
        }

        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(4px);
            z-index: 1100;
            display: none;
            justify-content: flex-end;
        }

        .drawer-overlay.open {
            display: flex;
        }

        .cart-drawer {
            background: #fff;
            width: 100%;
            max-width: 420px;
            height: 100%;
            display: flex;
            flex-direction: column;
            box-shadow: -10px 0 30px rgba(0,0,0,0.15);
            animation: slideInLeft 0.3s ease;
        }

        @keyframes slideInLeft {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }

        .drawer-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cart-item {
            display: flex;
            gap: 12px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            align-items: center;
        }

        .cart-item img {
            width: 62px;
            height: 62px;
            border-radius: 10px;
            object-fit: cover;
            background: #f1f5f9;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-title {
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .cart-item-price {
            font-weight: 800;
            color: var(--accent);
            font-size: 0.88rem;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }

        .qty-btn {
            width: 26px;
            height: 26px;
            border-radius: 7px;
            border: 1px solid var(--border-color);
            background: #f8fafc;
            font-weight: 800;
            cursor: pointer;
        }

        .drawer-footer {
            padding: 18px 20px;
            border-top: 1px solid var(--border-color);
            background: #f8fafc;
        }

        .cart-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 14px;
        }

        /* ==========================================================================
           9. عارض الصور بملء الشاشة (Lightbox) + الإشعارات (Toast)
           ========================================================================== */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            touch-action: pan-y;
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox img {
            max-width: 92vw;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 8px;
            user-select: none;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.4rem;
            cursor: pointer;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
        }

        .lightbox-nav.prev { right: 16px; }
        .lightbox-nav.next { left: 16px; }

        .lightbox-counter {
            color: #fff;
            margin-top: 14px;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--primary);
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            box-shadow: var(--shadow-lg);
            z-index: 3000;
            transform: translateY(120%);
            opacity: 0;
            transition: var(--transition);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: #fff;
            border-radius: var(--radius-lg);
            border: 1px dashed var(--border-color);
        }

        /* ==========================================================================
           10. التجاوب مع شاشات الجوال
           ========================================================================== */
        @media (max-width: 820px) {
            .modal-box {
                grid-template-columns: 1fr;
                max-height: 94vh;
                overflow-y: auto;
            }
            .modal-gallery {
                border-left: none;
                border-bottom: 1px solid var(--border-color);
                padding: 14px;
            }
            .modal-main-img-wrap {
                aspect-ratio: 4 / 3;
            }
            .modal-info {
                padding: 20px 18px;
                overflow-y: visible;
            }
        }

        @media (max-width: 640px) {
            .header-container {
                padding: 12px 14px;
            }
            .brand-info h1 {
                font-size: 1.05rem;
            }
            .search-sort-bar {
                grid-template-columns: 1fr 1fr;
            }
            .search-box {
                grid-column: 1 / -1;
            }
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
                padding: 0 12px;
            }
            .card-body {
                padding: 12px;
            }
            .card-title {
                font-size: 0.92rem;
            }
            .current-price {
                font-size: 1.08rem;
            }
            .card-actions {
                grid-template-columns: 1fr;
            }
            .card-nav-btn {
                display: none; /* السحب بالإصبع أفضل على الجوال */
            }
            .hide-mobile {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- عارض الصور بملء الشاشة (Lightbox) -->

        <button class="lightbox-close" onclick="closeLightbox()">✕</button>
        <button class="lightbox-nav prev" onclick="navigateLightbox(-1)">❯</button>

        <div class="lightbox-counter" id="lightboxCounter">1 / 1</div>

    <!-- إشعار منبثق -->
    <div class="toast" id="toast"></div>

    <script>
        /* ==========================================================================
           لوحة إعدادات المتجر (عدّل بياناتك هنا فقط بسهولة)
           ========================================================================== */
        const CONFIG = {
            storeName: "متجر النخبة",
            storeShortLetter: "ن",
            announcementText: "✨ شحن سريع لجميع مناطق المملكة • اطلب مباشرة عبر واتساب ✨",
            showAnnouncement: true,
            whatsappNumber: "966500000000", // ضع رقم الواتساب بصيغة 9665XXXXXXXX بدون علامة +
            currency: "ر.س",
            sheetCsvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTc7X-EvCAY9zFrW1idJkNtru0Su7mJx86EDXynv_b_SGqo1HYOX2OA6NXrQa-la0QUS02K5N0sS0Sz/pub?output=csv",
            refreshIntervalMinutes: 5
        };

        /* ==========================================================================
           حالة التطبيق (State)
           ========================================================================== */
        let allProducts = [];
        let filteredProducts = [];
        let selectedCategory = "الكل";
        let currentModalProduct = null;
        let currentLightboxImages = [];
        let currentLightboxIndex = 0;
        let lastSyncTime = null;
        let cart = JSON.parse(localStorage.getItem("store_cart_v1") || "[]");

        const CACHE_KEY = "store_products_cache_v1";

        /* ==========================================================================
           1. التهيئة الأولية
           ========================================================================== */
        document.addEventListener("DOMContentLoaded", () => {
            // تطبيق إعدادات الهوية
            document.title = `${CONFIG.storeName} | كتالوج المنتجات`;
            document.getElementById("storeTitle").textContent = CONFIG.storeName;
            document.getElementById("brandBadge").textContent = CONFIG.storeShortLetter;

            const annBar = document.getElementById("announcementBar");
            if (CONFIG.showAnnouncement && CONFIG.announcementText) {
                annBar.textContent = CONFIG.announcementText;
            } else {
                annBar.style.display = "none";
            }

            renderSkeletons();
            loadCachedProductsFirst();
            fetchSheetData(false);
            updateCartUI();

            // تحديث تلقائي كل 5 دقائق
            setInterval(() => {
                fetchSheetData(false);
            }, CONFIG.refreshIntervalMinutes * 60 * 1000);

            // تحديث عداد "منذ كذا دقيقة" كل 30 ثانية
            setInterval(updateSyncLabel, 30000);

            // دعم السحب بالإصبع في عارض الصور الكامل
            initLightboxSwipe();
        });

        /* ==========================================================================
           2. جلب البيانات من Google Sheets وتحويلها إلى JSON مع تجاوز الكاش
           ========================================================================== */
        function loadCachedProductsFirst() {
            try {
                const cached = localStorage.getItem(CACHE_KEY);
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        allProducts = parsed;
                        buildCategoryPills();
                        applyFilters();
                        checkDeepLink();
                    }
                }
            } catch (e) {
                console.warn("Cache read skipped:", e);
            }
        }

        async function fetchSheetData(isManual = false) {
            const refreshBtn = document.getElementById("refreshBtn");
            if (isManual) refreshBtn.classList.add("spinning");

            // إضافة Timestamp لتجاوز الكاش وضمان جلب أحدث البيانات دائماً
            const cacheBusterUrl = `${CONFIG.sheetCsvUrl}&_t=${Date.now()}`;

            try {
                const response = await fetch(cacheBusterUrl, { cache: "no-store" });
                if (!response.ok) throw new Error("فشل الاتصال بملف البيانات");
                
                const csvText = await response.text();
                
                Papa.parse(csvText, {
                    header: false,
                    skipEmptyLines: true,
                    complete: function(results) {
                        const rows = results.data;
                        if (rows.length <= 1) return;

                        // تخطي صف العناوين (الصف الأول) وتحويل الأعمدة A إلى H إلى كائنات JSON
                        const parsedProducts = rows.slice(1).map((row, index) => {
                            const id = (row[0] || `PRD-${index + 1}`).toString().trim();
                            const category = (row[1] || "عام").toString().trim();
                            const name = (row[2] || "").toString().trim();
                            const description = (row[3] || "").toString().trim();
                            const salePrice = parsePrice(row[4]);
                            const oldPrice = parsePrice(row[5]);
                            const rawImages = (row[6] || "").toString();
                            const statusRaw = (row[7] || "yes").toString().trim().toLowerCase();

                            // معالجة الصور المفصولة بفاصلة , بحد أقصى 10 صور
                            const images = rawImages
                                .split(",")
                                .map(url => normalizeImageUrl(url.trim()))
                                .filter(url => url.length > 0)
                                .slice(0, 10);

                            // منطق الخصم الدقيق: يظهر فقط إذا كان السعر قبل الخصم أعلى من سعر البيع
                            const hasDiscount = oldPrice > 0 && salePrice > 0 && oldPrice > salePrice;
                            const discountPercent = hasDiscount 
                                ? Math.round(((oldPrice - salePrice) / oldPrice) * 100) 
                                : 0;
                            const savingsAmount = hasDiscount ? +(oldPrice - salePrice).toFixed(2) : 0;

                            return {
                                id,
                                category,
                                name,
                                description,
                                salePrice,
                                oldPrice,
                                hasDiscount,
                                discountPercent,
                                savingsAmount,
                                images,
                                inStock: statusRaw === "yes"
                            };
                        }).filter(p => p.name !== ""); // استبعاد الصفوف الفارغة

                        if (parsedProducts.length > 0) {
                            allProducts = parsedProducts;
                            localStorage.setItem(CACHE_KEY, JSON.stringify(allProducts));
                            syncCartWithLatestStock();
                            buildCategoryPills();
                            applyFilters();
                            checkDeepLink();
                        }

                        lastSyncTime = new Date();
                        updateSyncLabel();
                        if (isManual) showToast("✅ تم تحديث الأسعار والمخزون بنجاح");
                    }
                });
            } catch (error) {
                console.error("Fetch error:", error);
                if (allProducts.length === 0) {
                    document.getElementById("productsGrid").innerHTML = `
                        <div class="empty-state">
                            <h3>تعذر تحميل المنتجات حالياً</h3>
                            <p style="color:var(--text-muted); margin:8px 0 16px;">يرجى التحقق من الاتصال بالإنترنت والمحاولة مرة أخرى</p>
                            <button class="btn-details" style="padding:0 24px;" onclick="fetchSheetData(true)">إعادة المحاولة</button>
                        </div>`;
                } else if (isManual) {
                    showToast("⚠️ تعذر الاتصال، يتم عرض آخر نسخة محفوظة");
                }
            } finally {
                if (isManual) setTimeout(() => refreshBtn.classList.remove("spinning"), 500);
            }
        }

        function parsePrice(val) {
            if (!val) return 0;
            // دعم الأرقام العربية والإنجليزية وإزالة أي نصوص
            const normalized = val.toString()
                .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
                .replace(/[^0-9.]/g, "");
            return parseFloat(normalized) || 0;
        }

        // تحويل روابط Google Drive تلقائياً إلى روابط صور مباشرة
        function normalizeImageUrl(url) {
            if (!url) return "";
            const driveMatch = url.match(/(?:drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=))([a-zA-Z0-9_-]+)/);
            if (driveMatch && driveMatch[1]) {
                return `https://lh3.googleusercontent.com/d/${driveMatch[1]}=w1000`;
            }
            return url;
        }

        function updateSyncLabel() {
            const label = document.getElementById("lastSyncText");
            if (!lastSyncTime) return;
            const diffMins = Math.floor((new Date() - lastSyncTime) / 60000);
            if (diffMins < 1) {
                label.textContent = "مُحدّث الآن • مباشر";
            } else {
                label.textContent = `آخر تحديث: منذ ${diffMins} دقيقة`;
            }
        }

        /* ==========================================================================
           3. الفلترة، البحث، والترتيب الذكي
           ========================================================================== */
        function buildCategoryPills() {
            const container = document.getElementById("categoriesContainer");
            const categories = ["الكل", ...new Set(allProducts.map(p => p.category).filter(Boolean))];
            
            if (!categories.includes(selectedCategory)) {
                selectedCategory = "الكل";
            }

            container.innerHTML = categories.map(cat => `
                <button class="category-pill ${cat === selectedCategory ? 'active' : ''}" 
                        onclick="selectCategory('${escapeHtml(cat)}')">
                    ${escapeHtml(cat)}
                </button>
            `).join("");
        }

        function selectCategory(cat) {
            selectedCategory = cat;
            buildCategoryPills();
            applyFilters();
        }

        function resetFilters(e) {
            if (e) e.preventDefault();
            selectedCategory = "الكل";
            document.getElementById("searchInput").value = "";
            document.getElementById("sortSelect").value = "default";
            document.getElementById("inStockOnly").checked = false;
            buildCategoryPills();
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById("searchInput").value.trim().toLowerCase();
            const sortBy = document.getElementById("sortSelect").value;
            const inStockOnly = document.getElementById("inStockOnly").checked;

            let result = allProducts.filter(p => {
                const matchesCat = selectedCategory === "الكل" || p.category === selectedCategory;
                const matchesStock = !inStockOnly || p.inStock;
                const matchesQuery = !query || 
                    p.name.toLowerCase().includes(query) || 
                    p.description.toLowerCase().includes(query) ||
                    p.id.toLowerCase().includes(query);
                return matchesCat && matchesStock && matchesQuery;
            });

            // الترتيب الذكي: المنتجات المتاحة دائماً في المقدمة ونفذت الكمية في النهاية
            result.sort((a, b) => {
                if (a.inStock !== b.inStock) {
                    return a.inStock ? -1 : 1;
                }
                if (sortBy === "price-asc") return a.salePrice - b.salePrice;
                if (sortBy === "price-desc") return b.salePrice - a.salePrice;
                if (sortBy === "discount") return b.discountPercent - a.discountPercent;
                return 0;
            });

            filteredProducts = result;
            renderProducts();
        }

        /* ==========================================================================
           4. عرض بطاقات المنتجات (Rendering)
           ========================================================================== */
        function renderSkeletons() {
            const grid = document.getElementById("productsGrid");
            grid.innerHTML = Array(8).fill(0).map(() => `
                <div class="product-card" style="padding:14px;">
                    <div class="skeleton" style="aspect-ratio:1/1; width:100%; margin-bottom:14px;"></div>
                    <div class="skeleton" style="height:14px; width:40%; margin-bottom:8px;"></div>
                    <div class="skeleton" style="height:20px; width:85%; margin-bottom:10px;"></div>
                    <div class="skeleton" style="height:24px; width:50%; margin-bottom:14px;"></div>
                    <div class="skeleton" style="height:40px; width:100%;"></div>
                </div>
            `).join("");
        }

        function renderProducts() {
            const grid = document.getElementById("productsGrid");
            const countLabel = document.getElementById("resultsCount");
            countLabel.textContent = `عرض ${filteredProducts.length} منتج`;

            if (filteredProducts.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h3>لا توجد منتجات مطابقة لبحثك</h3>
                        <p style="color:var(--text-muted); margin:8px 0 16px;">جرب البحث بكلمة أخرى أو تصفح جميع الفئات</p>
                        <button class="btn-details" style="padding:0 22px;" onclick="resetFilters()">عرض كل المنتجات</button>
                    </div>`;
                return;
            }

            grid.innerHTML = filteredProducts.map(product => {
                const hasMultipleImages = product.images.length > 1;
                const slidesHtml = product.images.length > 0 
                    ? product.images.map((img, i) => `
                        <div class="card-slide">
                            <img src="${escapeHtml(img)}" alt="${escapeHtml(product.name)}" loading="lazy" 
                                 onerror="this.parentElement.innerHTML='<div class=\\'img-fallback\\'>${escapeHtml(CONFIG.storeName)}</div>'">
                        </div>`).join("")
                    : `<div class="card-slide"><div class="img-fallback">${escapeHtml(CONFIG.storeName)}</div></div>`;

                const dotsHtml = hasMultipleImages ? `
                    <div class="slider-dots" id="dots-${escapeHtml(product.id)}">
                        ${product.images.map((_, i) => `<span class="slider-dot ${i === 0 ? 'active' : ''}"></span>`).join("")}
                    </div>
                    <button class="card-nav-btn prev" onclick="slideCard(event, '${escapeHtml(product.id)}', -1)">❯</button>
                    <button class="card-nav-btn next" onclick="slideCard(event, '${escapeHtml(product.id)}', 1)">❮</button>
                    <span class="photo-count-badge">📷 ${product.images.length}</span>
                ` : "";

                return `
                <article class="product-card ${product.inStock ? '' : 'out-of-stock'}">
                    <div class="badges-container">
                        ${!product.inStock ? `<span class="badge badge-out">نفذت الكمية</span>` : ""}
                        ${product.inStock && product.hasDiscount ? `<span class="badge badge-discount">خصم ${product.discountPercent}%</span>` : ""}
                    </div>

                    <div class="card-media" onclick="openProductModal('${escapeHtml(product.id)}')">
                        <div class="card-slider-track" id="track-${escapeHtml(product.id)}" onscroll="updateCardDots('${escapeHtml(product.id)}')">
                            ${slidesHtml}
                        </div>
                        ${dotsHtml}
                    </div>

                    <div class="card-body">
                        <span class="card-category">${escapeHtml(product.category)}</span>
                        <h3 class="card-title" onclick="openProductModal('${escapeHtml(product.id)}')">${escapeHtml(product.name)}</h3>
                        <p class="card-desc">${escapeHtml(product.description)}</p>

                        <div class="card-price-row">
                            <span class="current-price">${formatNumber(product.salePrice)} <span class="currency">${CONFIG.currency}</span></span>
                            ${product.hasDiscount ? `<span class="old-price">${formatNumber(product.oldPrice)} ${CONFIG.currency}</span>` : ""}
                        </div>

                        <div class="card-actions">
                            <button class="btn-details" onclick="openProductModal('${escapeHtml(product.id)}')">
                                ${product.inStock ? 'التفاصيل والطلب' : 'عرض التفاصيل'}
                            </button>
                            <button class="btn-add-cart ${product.inStock ? '' : 'btn-disabled'}" 
                                    ${product.inStock ? `onclick="addToCart('${escapeHtml(product.id)}')"` : 'disabled'}
                                    title="أضف للسلة">
                                + للسلة
                            </button>
                        </div>
                    </div>
                </article>`;
            }).join("");
        }

        function slideCard(event, productId, direction) {
            event.stopPropagation();
            const track = document.getElementById(`track-${productId}`);
            if (!track) return;
            // في RTL التمرير لليسار يكون بقيمة سالبة
            track.scrollBy({ left: -direction * track.clientWidth, behavior: "smooth" });
        }

        function updateCardDots(productId) {
            const track = document.getElementById(`track-${productId}`);
            const dotsWrap = document.getElementById(`dots-${productId}`);
            if (!track || !dotsWrap) return;
            const index = Math.round(Math.abs(track.scrollLeft) / track.clientWidth);
            const dots = dotsWrap.querySelectorAll(".slider-dot");
            dots.forEach((dot, i) => dot.classList.toggle("active", i === index));
        }

        /* ==========================================================================
           5. نافذة تفاصيل المنتج + عارض الصور الكامل (Lightbox)
           ========================================================================== */
        function openProductModal(productId) {
            const product = allProducts.find(p => p.id === productId);
            if (!product) return;

            currentModalProduct = product;
            currentLightboxImages = product.images.length > 0 ? product.images : [];
            currentLightboxIndex = 0;

            document.getElementById("modalCategory").textContent = product.category;
            document.getElementById("modalSku").textContent = `#${product.id}`;
            document.getElementById("modalTitle").textContent = product.name;
            document.getElementById("modalDesc").textContent = product.description || "لا يوجد وصف إضافي لهذا المنتج.";
            document.getElementById("modalPrice").innerHTML = `${formatNumber(product.salePrice)} <span class="currency">${CONFIG.currency}</span>`;

            const oldPriceEl = document.getElementById("modalOldPrice");
            const badgeEl = document.getElementById("modalDiscountBadge");
            const savingsEl = document.getElementById("modalSavings");

            if (product.hasDiscount) {
                oldPriceEl.textContent = `${formatNumber(product.oldPrice)} ${CONFIG.currency}`;
                oldPriceEl.style.display = "inline";
                badgeEl.textContent = `خصم ${product.discountPercent}%`;
                badgeEl.style.display = "inline-block";
                savingsEl.textContent = `🎉 وفّرت ${formatNumber(product.savingsAmount)} ${CONFIG.currency}`;
                savingsEl.style.display = "inline-block";
            } else {
                oldPriceEl.style.display = "none";
                badgeEl.style.display = "none";
                savingsEl.style.display = "none";
            }

            // معرض الصور داخل النافذة
            const mainImg = document.getElementById("modalMainImg");
            const thumbsContainer = document.getElementById("modalThumbs");

            if (product.images.length > 0) {
                mainImg.src = product.images[0];
                thumbsContainer.innerHTML = product.images.map((img, idx) => `
                    <div class="modal-thumb ${idx === 0 ? 'active' : ''}" onclick="selectModalImage(${idx})">
                        <img src="${escapeHtml(img)}" alt="صورة ${idx + 1}">
                    </div>
                `).join("");
                thumbsContainer.style.display = product.images.length > 1 ? "flex" : "none";
            } else {
                mainImg.src = "";
                thumbsContainer.style.display = "none";
            }

            // أزرار الطلب حسب التوفر
            const waBtn = document.getElementById("modalWhatsappBtn");
            const addCartBtn = document.getElementById("modalAddCartBtn");

            if (product.inStock) {
                waBtn.disabled = false;
                waBtn.classList.remove("btn-disabled");
                waBtn.innerHTML = `<span>اطلب الآن عبر واتساب</span>`;
                waBtn.onclick = () => orderSingleViaWhatsapp(product);

                addCartBtn.disabled = false;
                addCartBtn.classList.remove("btn-disabled");
                addCartBtn.onclick = () => {
                    addToCart(product.id);
                    closeProductModal();
                };
            } else {
                waBtn.disabled = true;
                waBtn.classList.add("btn-disabled");
                waBtn.innerHTML = `<span>نفذت الكمية حالياً</span>`;
                addCartBtn.disabled = true;
                addCartBtn.classList.add("btn-disabled");
            }

            // تحديث الرابط لسهولة المشاركة
            history.replaceState(null, "", `#product-${encodeURIComponent(product.id)}`);
            document.getElementById("productModal").classList.add("open");
            document.body.style.overflow = "hidden";
        }

        function selectModalImage(index) {
            if (!currentModalProduct || !currentModalProduct.images[index]) return;
            currentLightboxIndex = index;
            document.getElementById("modalMainImg").src = currentModalProduct.images[index];
            document.querySelectorAll(".modal-thumb").forEach((el, i) => {
                el.classList.toggle("active", i === index);
            });
        }

        function closeProductModal() {
            document.getElementById("productModal").classList.remove("open");
            document.body.style.overflow = "";
            history.replaceState(null, "", window.location.pathname + window.location.search);
        }

        function checkDeepLink() {
            const hash = window.location.hash;
            if (hash && hash.startsWith("#product-")) {
                const targetId = decodeURIComponent(hash.replace("#product-", ""));
                if (!document.getElementById("productModal").classList.contains("open")) {
                    openProductModal(targetId);
                }
            }
        }

        function shareCurrentProduct() {
            if (!currentModalProduct) return;
            const shareUrl = `${window.location.origin}${window.location.pathname}#product-${encodeURIComponent(currentModalProduct.id)}`;
            if (navigator.share) {
                navigator.share({
                    title: currentModalProduct.name,
                    text: `${currentModalProduct.name} - بسعر ${currentModalProduct.salePrice} ${CONFIG.currency}`,
                    url: shareUrl
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareUrl);
                showToast("🔗 تم نسخ رابط المنتج لمشاركته");
            }
        }

        // Lightbox بملء الشاشة
        function openLightbox() {
            if (currentLightboxImages.length === 0) return;
            updateLightboxView();
            document.getElementById("lightbox").classList.add("open");
        }

        function closeLightbox() {
            document.getElementById("lightbox").classList.remove("open");
        }

        function navigateLightbox(step) {
            if (currentLightboxImages.length <= 1) return;
            currentLightboxIndex = (currentLightboxIndex + step + currentLightboxImages.length) % currentLightboxImages.length;
            updateLightboxView();
        }

        function updateLightboxView() {
            document.getElementById("lightboxImg").src = currentLightboxImages[currentLightboxIndex];
            document.getElementById("lightboxCounter").textContent = `${currentLightboxIndex + 1} / ${currentLightboxImages.length}`;
        }

        function initLightboxSwipe() {
            const lb = document.getElementById("lightbox");
            let startX = 0;
            lb.addEventListener("touchstart", e => startX = e.changedTouches[0].screenX, { passive: true });
            lb.addEventListener("touchend", e => {
                const diff = e.changedTouches[0].screenX - startX;
                if (Math.abs(diff) > 45) {
                    navigateLightbox(diff > 0 ? -1 : 1);
                }
            }, { passive: true });
        }

        /* ==========================================================================
           6. سلة المشتريات والطلب المباشر عبر واتساب
           ========================================================================== */
        function addToCart(productId) {
            const product = allProducts.find(p => p.id === productId);
            if (!product || !product.inStock) return;

            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ id: productId, qty: 1 });
            }
            saveCart();
            updateCartUI();
            showToast(`🛒 تمت إضافة "${product.name}" إلى السلة`);
        }

        function updateCartQty(productId, delta) {
            const index = cart.findIndex(item => item.id === productId);
            if (index === -1) return;
            cart[index].qty += delta;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            saveCart();
            updateCartUI();
        }

        function saveCart() {
            localStorage.setItem("store_cart_v1", JSON.stringify(cart));
        }

        function syncCartWithLatestStock() {
            if (allProducts.length === 0 || cart.length === 0) return;
            const beforeLen = cart.length;
            cart = cart.filter(item => {
                const p = allProducts.find(prod => prod.id === item.id);
                return p && p.inStock;
            });
            if (cart.length < beforeLen) {
                saveCart();
                showToast("⚠️ تم تحديث السلة لاستبعاد منتج نفذت كميته");
            }
            updateCartUI();
        }

        function updateCartUI() {
            let totalItems = 0;
            let totalAmount = 0;

            const container = document.getElementById("cartItemsContainer");
            const itemsHtml = cart.map(item => {
                const p = allProducts.find(prod => prod.id === item.id);
                if (!p) return "";
                totalItems += item.qty;
                totalAmount += p.salePrice * item.qty;
                const thumb = p.images[0] || "";

                return `
                <div class="cart-item">
                    ${thumb ? `<img src="${escapeHtml(thumb)}" alt="">` : `<div style="width:62px;height:62px;background:#f1f5f9;border-radius:10px;"></div>`}
                    <div class="cart-item-info">
                        <div class="cart-item-title">${escapeHtml(p.name)}</div>
                        <div class="cart-item-price">${formatNumber(p.salePrice)} ${CONFIG.currency}</div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="updateCartQty('${escapeHtml(p.id)}', -1)">-</button>
                            <span style="font-weight:700; min-width:20px; text-align:center;">${item.qty}</span>
                            <button class="qty-btn" onclick="updateCartQty('${escapeHtml(p.id)}', 1)">+</button>
                        </div>
                    </div>
                </div>`;
            }).join("");

            container.innerHTML = totalItems > 0 
                ? itemsHtml 
                : `<div style="text-align:center; padding:50px 10px; color:var(--text-muted);">سلة الطلبات فارغة حالياً</div>`;

            document.getElementById("headerCartCount").textContent = totalItems;
            document.getElementById("floatingCartCount").textContent = totalItems;
            document.getElementById("floatingCartTotal").textContent = `${formatNumber(totalAmount)} ${CONFIG.currency}`;
            document.getElementById("drawerTotalAmount").textContent = `${formatNumber(totalAmount)} ${CONFIG.currency}`;

            const floatingBtn = document.getElementById("floatingCartBtn");
            floatingBtn.classList.toggle("visible", totalItems > 0);
        }

        function toggleCartDrawer(open) {
            document.getElementById("cartDrawer").classList.toggle("open", open);
        }

        function orderSingleViaWhatsapp(product) {
            const msg = [
                `مرحباً ${CONFIG.storeName} 👋`,
                `أرغب بطلب المنتج التالي:`,
                `• *المنتج:* ${product.name}`,
                `• *المعرف:* #${product.id}`,
                `• *السعر:* ${formatNumber(product.salePrice)} ${CONFIG.currency}`,
                `• *الرابط:* ${window.location.origin}${window.location.pathname}#product-${encodeURIComponent(product.id)}`
            ].join("\n");

            openWhatsapp(msg);
        }

        function checkoutCartViaWhatsapp() {
            if (cart.length === 0) {
                showToast("السلة فارغة!");
                return;
            }
            let total = 0;
            const lines = [`مرحباً ${CONFIG.storeName} 👋`, `أرغب بطلب المنتجات التالية:`];

            cart.forEach((item, idx) => {
                const p = allProducts.find(prod => prod.id === item.id);
                if (!p) return;
                const sub = p.salePrice * item.qty;
                total += sub;
                lines.push(`${idx + 1}. *${p.name}* (#${p.id}) — الكمية: ${item.qty} × ${formatNumber(p.salePrice)} = ${formatNumber(sub)} ${CONFIG.currency}`);
            });

            lines.push(`\n💰 *الإجمالي:* ${formatNumber(total)} ${CONFIG.currency}`);
            openWhatsapp(lines.join("\n"));
        }

        function openWhatsapp(text) {
            const url = `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(text)}`;
            window.open(url, "_blank");
        }

        /* ==========================================================================
           7. دوال مساعدة
           ========================================================================== */
        function formatNumber(num) {
            return Number(num).toLocaleString("en-US", { maximumFractionDigits: 2 });
        }

        function escapeHtml(str) {
            if (!str) return "";
            return str.toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.classList.add("show");
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => toast.classList.remove("show"), 3000);
        }
    </script>
</body>
</html>
